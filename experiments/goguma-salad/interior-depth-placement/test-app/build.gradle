plugins { id 'com.android.application'; id 'kotlin-android' }
android {
    namespace 'com.project.depthplacement.lab'; compileSdk 35
    defaultConfig { applicationId 'com.project.depthplacement.lab'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation project(':depth-placement-core')
    implementation project(':depth-placement-arcore')
    implementation project(':depth-placement-debug')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.ar:core:1.48.0'
}
