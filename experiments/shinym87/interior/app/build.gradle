plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.hackathon.interior'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hackathon.interior'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Filament ships pre-compiled material/texture assets that must not be re-compressed.
    androidResources {
        noCompress 'filamat', 'ktx'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // SceneView for ARCore: camera background, plane detection + grid rendering,
    // and a Filament-based scene graph. Pulls in com.google.ar:core and Filament.
    implementation 'io.github.sceneview:arsceneview:2.3.0'
}
