# 경로에 한글이 있어 Windows 에서 인코딩 문제가 나지 않도록 UTF-8 을 강제한다.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 저장소 경로에 한글(신유민)이 포함되어 있어 AGP 기본 경로 검사를 통과하도록 예외 처리한다.
android.overridePathCheck=true

kotlin.code.style=official
# 한글 경로에서 Kotlin 컴파일러 워커가 소스 경로를 못 찾는 문제를 피하려고
# 컴파일러를 Gradle 데몬 프로세스 안에서 직접 실행한다.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
