plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def interiorApiBaseUrl = project.findProperty('INTERIOR_API_BASE_URL') ?: 'http://10.0.2.2:8000'

android {
    namespace 'com.hackathon.interior'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hackathon.interior'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'INTERIOR_API_BASE_URL', "\"${interiorApiBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Filament ships pre-compiled material/texture assets that must not be re-compressed.
    androidResources {
        noCompress 'filamat', 'ktx'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // lifecycleScope + coroutines: 서버 호출(키프레임 업로드/폴링)을 백그라운드에서 돌린다.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // SceneView for ARCore: camera background, plane detection + grid rendering,
    // and a Filament-based scene graph. Pulls in com.google.ar:core and Filament.
    implementation 'io.github.sceneview:arsceneview:2.3.0'
}
