<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR 라이프</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#d9e2e9,#b8c8d2);font-family:Arial,sans-serif;color:#102037}button{font:inherit}.app{width:min(100%,430px);height:min(900px,100vh);margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 70px #2338;border-radius:32px}.head{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center}.head b{font-size:18px}.head small{display:block;color:#08a477;font-weight:800;letter-spacing:.15em}.bell{border:0;border-radius:50%;width:40px;height:40px;background:#f1f5f6}.tabs{display:flex;gap:8px;padding:0 18px 12px}.tabs button{flex:1;border:0;border-radius:13px;padding:11px;background:#eef2f4;color:#7d8998;font-weight:800}.tabs .on{background:#102037;color:#fff}.view{flex:1;position:relative;overflow:hidden;background:linear-gradient(#93cbd7 0 37%,#6f8980 38%)}.build{position:absolute;bottom:18%;background:linear-gradient(90deg,#71838a,#aeb8b8,#687b83);height:52%;width:36%;box-shadow:0 12px 30px #1235}.b1{left:-3%;height:40%}.b2{left:34%}.b3{right:-5%;height:32%}.road{position:absolute;bottom:-15%;width:120%;left:-10%;height:40%;background:#b5b8aa;transform:perspective(150px) rotateX(45deg)}.marker{position:absolute;transform:translate(-50%,-50%);border:0;background:#102037e8;color:white;border-radius:14px;padding:9px 11px;text-align:left;box-shadow:0 6px 15px #1236}.marker b,.marker small{display:block}.marker small{opacity:.7;margin-top:2px}.marker.on{outline:3px solid #64f3c5}.list{display:none;flex:1;padding:16px;background:#f3f6f7;overflow:auto}.card{width:100%;background:#fff;border:1px solid #e5eaed;border-radius:16px;padding:15px;text-align:left;margin-bottom:9px}.card.on{border-color:#36d1a3}.card b,.card small{display:block}.card small{color:#788597;margin-top:4px}.sheet{padding:12px 20px 16px;box-shadow:0 -8px 25px #2342}.sheet small{color:#8793a2}.sheet h2{margin:4px 0 10px}.info{background:#f3f6f7;border-radius:11px;padding:11px;font-size:13px}.action{width:100%;border:0;background:#102037;color:#fff;border-radius:14px;padding:13px;margin-top:10px;font-weight:800}.action.done{background:#16b889}.nav{height:64px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #eef1f2}.nav button{border:0;background:white;color:#9ca6b2}.nav .on{color:#09a477;font-weight:800}@media(max-width:480px){.app{border-radius:0}}
</style></head><body><main class="app"><header class="head"><div><small>AR LIFE</small><b>자이 리버파크</b></div><button class="bell">🔔</button></header><div class="tabs"><button class="on" id="arTab">▣ AR 탐색</button><button id="listTab">⌖ 목록 보기</button></div><section class="view" id="view"><div class="build b1"></div><div class="build b2"></div><div class="build b3"></div><div class="road"></div></section><section class="list" id="list"></section><aside class="sheet"><small>선택한 생활 정보 · LIVE</small><h2 id="title"></h2><div class="info" id="detail"></div><button class="action" id="action"></button></aside><nav class="nav"><button class="on">AR</button><button>단지</button><button>추천</button><button>알림</button></nav></main><script>
const spots=[{id:'car',name:'🚗 내 차',detail:'B2 · 18번 기둥',action:'길 안내 시작',x:'19%',y:'68%'},{id:'parcel',name:'📦 택배함',detail:'새 택배 2개 도착',action:'수령 QR 열기',x:'68%',y:'48%'},{id:'energy',name:'⚡ 우리 집',detail:'대기전력 3개 감지',action:'한 번에 끄기',x:'47%',y:'22%'},{id:'cafe',name:'☕ 커뮤니티 카페',detail:'지금 좌석 여유',action:'자리 확인',x:'78%',y:'74%'}];let selected=spots[1];const view=document.querySelector('#view'),list=document.querySelector('#list'),title=document.querySelector('#title'),detail=document.querySelector('#detail'),action=document.querySelector('#action');function render(){view.querySelectorAll('.marker').forEach(x=>x.remove());list.innerHTML='';spots.forEach(s=>{const m=document.createElement('button');m.className='marker '+(s.id===selected.id?'on':'');m.style.left=s.x;m.style.top=s.y;m.innerHTML='<b>'+s.name+'</b><small>'+s.detail+'</small>';m.onclick=()=>select(s);view.appendChild(m);const c=document.createElement('button');c.className='card '+(s.id===selected.id?'on':'');c.innerHTML='<b>'+s.name+'</b><small>'+s.detail+'</small>';c.onclick=()=>select(s);list.appendChild(c)});title.textContent=selected.name;detail.textContent=selected.detail;action.textContent=selected.action;action.classList.remove('done')}function select(s){selected=s;render()}action.onclick=()=>{action.textContent='처리되었습니다 ✓';action.classList.add('done')};document.querySelector('#arTab').onclick=()=>{view.style.display='block';list.style.display='none';arTab.className='on';listTab.className=''};document.querySelector('#listTab').onclick=()=>{view.style.display='none';list.style.display='block';listTab.className='on';arTab.className=''};render();
</script></body></html>
